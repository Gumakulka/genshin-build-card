<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Build Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Genshin Build Card</h1>
    <p>Wpisz UID gracza, aby zobaczyć jego postacie.</p>
    <form id="uid-form">
      <input id="uid-input" type="text" inputmode="numeric" placeholder="UID, np. 800000000" required>
      <button type="submit">Szukaj</button>
    </form>
    <div id="result"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
