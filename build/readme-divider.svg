<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b53a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0b53a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0b53a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff2c4" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="80" y="11" width="1040" height="2" fill="url(#line)"/>
  <rect x="80" y="10" width="160" height="4" fill="url(#shine)" opacity="0.9">
    <animate attributeName="x" values="80;960;80" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(600 12) rotate(45)">
    <rect x="-6" y="-6" width="12" height="12" fill="#15110b" stroke="#f0b53a" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
