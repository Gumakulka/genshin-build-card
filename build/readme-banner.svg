<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Genshin Build Card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17120a"/>
      <stop offset="0.55" stop-color="#2b1c08"/>
      <stop offset="1" stop-color="#110d07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#f0b53a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f0b53a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c78a1a"/>
      <stop offset="0.35" stop-color="#fff2c4"/>
      <stop offset="0.65" stop-color="#f0b53a"/>
      <stop offset="1" stop-color="#c78a1a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="elements" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="0.17" stop-color="#4cc2ff"/>
      <stop offset="0.34" stop-color="#7bd84b"/>
      <stop offset="0.5" stop-color="#b985ff"/>
      <stop offset="0.67" stop-color="#9fe8ff"/>
      <stop offset="0.83" stop-color="#5fe0b8"/>
      <stop offset="1" stop-color="#f0b53a"/>
    </linearGradient>
    <path id="st" d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z" fill="#fff2c4"/>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <g transform="translate(600 150)" fill="none" stroke="#f0b53a" stroke-opacity="0.22">
    <circle r="132" stroke-width="1.5" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="168" stroke-width="1" stroke-dasharray="14 22">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="90s" repeatCount="indefinite"/>
    </circle>
  </g>
  <use href="#st" x="90" y="60" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0s" repeatCount="indefinite"/></use>
  <use href="#st" x="240" y="236" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></use>
  <use href="#st" x="360" y="48" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2s" repeatCount="indefinite"/></use>
  <use href="#st" x="840" y="52" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></use>
  <use href="#st" x="960" y="240" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></use>
  <use href="#st" x="1110" y="70" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></use>
  <use href="#st" x="1090" y="250" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.2s" repeatCount="indefinite"/></use>
  <use href="#st" x="150" y="160" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="1.8s" repeatCount="indefinite"/></use>
  <text x="600" y="152" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="7" fill="url(#gold)">GENSHIN BUILD CARD</text>
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="21" fill="#e9d9ab" fill-opacity="0.92">Karty buildów z gabloty Genshin Impact</text>
  <text x="600" y="230" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="17" fill="#e9d9ab" fill-opacity="0.65">Character build cards from your Genshin Impact showcase</text>
  <rect x="0" y="314" width="1200" height="6" fill="url(#elements)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
