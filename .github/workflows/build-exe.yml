name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sources
        run: npm run check

      - name: Build exe
        run: npm run dist

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: genshin-build-card-windows
          path: dist/*.exe
