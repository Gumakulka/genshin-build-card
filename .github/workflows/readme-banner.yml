name: Build README banner

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_readme_banner.py
      - .github/workflows/readme-banner.yml

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: mkdir -p build && python scripts/build_readme_banner.py
      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/readme-banner.webp
          git diff --cached --quiet || (git commit -m "Update README banner" && git push)
